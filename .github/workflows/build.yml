name: Build and Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore EmpathicCulturalNetwork.sln

      - name: Build
        run: dotnet build EmpathicCulturalNetwork.sln --configuration Release --no-restore

      - name: Publish API and website
        run: dotnet publish src/Empathic.Api/Empathic.Api.csproj --configuration Release --no-build --output ./publish

      - name: Verify deployable website assets
        shell: bash
        run: |
          test -f ./publish/wwwroot/index.html
          test -f ./publish/wwwroot/join.html
          test -f ./publish/wwwroot/join.css
          test -f ./publish/wwwroot/join.js
          test -f ./publish/wwwroot/platform.html
          test -f ./publish/wwwroot/styles.css
          test -f ./publish/wwwroot/site.js
          test -f ./publish/wwwroot/app.js
          test -f ./publish/wwwroot/privacy.html
          test -f ./publish/wwwroot/terms.html

      - name: Build Docker image
        run: docker build -t empathic-app:ci .

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: empathic-app
          path: ./publish
          if-no-files-found: error
          retention-days: 14
